<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="new-todo-form" class="new-todo" autocomplete="off">
      <input id="new-todo" type="text" placeholder="やることを入力して Enter" aria-label="新しいタスク" maxlength="200" autofocus>
      <button type="submit">追加</button>
    </form>

    <section id="main" class="card" hidden>
      <label class="toggle-all">
        <input id="toggle-all" type="checkbox">
        すべて完了にする
      </label>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-message" class="empty" hidden>該当するタスクはありません</p>
    </section>

    <footer id="footer" class="footer" hidden>
      <span id="todo-count" aria-live="polite"></span>
      <nav class="filters" aria-label="表示の絞り込み">
        <a href="#/" data-filter="all">すべて</a>
        <a href="#/active" data-filter="active">未完了</a>
        <a href="#/completed" data-filter="completed">完了済み</a>
      </nav>
      <button id="clear-completed" type="button" class="link-button">完了済みを削除</button>
    </footer>

    <p class="hint">ダブルクリックで編集 ・ Esc で編集を取り消し ・ データはこのブラウザに保存されます</p>
  </main>
</body>
</html>
